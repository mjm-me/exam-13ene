<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Ejercicio de examen para certificado de profesionalidad">

    <title>Examen practico 2025-01-13</title>
    <link rel="icon" type="image/png" href="./favicon-32x32.png">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@300..900&family=Overpass:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,400;0,700;00;1,900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./styles/reset.css">
    <link rel="stylesheet" href="./styles/styles.css">
    <script src="./script/script.js" defer></script>
</head>

<main>
    <h1>¿Cpmo lo hicimos?</h1>

    <main>

        <form id="playerForm">
            <div class="player-input">
                <div>
                    <label for="player1Name">Nombre Jugador 1:</label>
                    <input type="text" id="player1Name" required>
                </div>
                <div>
                    <label for="player1Alias">Alias Jugador 1:</label>
                    <input type="text" id="player1Alias" required>
                </div>
            </div>
            <div class="player-input">
                <div>
                    <label for="player2Name">Nombre Jugador 2:</label>
                    <input type="text" id="player2Name" required>
                </div>
                <div>
                    <label for="player2Alias">Alias Jugador 2:</label>
                    <input type="text" id="player2Alias" required>
                </div>
            </div>
            <button type="submit">Guardar y Jugar</button>
        </form>

        <div id="game" class="hidden">
            <div id="playerInfo"></div>
            <div id="currentPlayer"></div>
            <div id="board">
                <!-- Tablero de juego -->
            </div>
            <button id="resetBtn">Reiniciar Partida</button>
            <button id="newGameBtn">Nuevo Juego</button>
        </div>
    </main>
    </body>

</html>
